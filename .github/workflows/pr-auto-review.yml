name: PR auto-review

# Thin stub — the pipeline lives in chrischall/workflows.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# `labeled` events get their own group keyed by label name: opening a PR
# with --label fires `opened`+`labeled` back-to-back, and a shared group
# would let the labeled event displace the queued review, leaving the PR
# with no verdict and no label.
concurrency:
  group: |
    pr-auto-review-${{ github.event.pull_request.number }}${{
      github.event.action == 'labeled'
        && format('-labeled-{0}', github.event.label.name)
        || ''
    }}
  cancel-in-progress: false

jobs:
  review:
    uses: chrischall/workflows/.github/workflows/reusable-pr-auto-review.yml@main
    with:
      conventions_hint: "Reverse-engineered protocol client: AGENTS.md is the source of truth for why logic lives in the proxy rather than in opencode hooks — a change moving trimming back into an opencode hook needs evidence that hook now works. Prompt text in fenced.ts/plugin.ts must stay soft: no fake role turns, no shouted absolutes (M365's Disengaged filter tracks prompt shape). Never add code that deletes a Copilot Studio agent. Tests must never require network, credentials, or live M365. Access tokens must never be logged or echoed in an error."
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      release_pat: ${{ secrets.RELEASE_PAT }}
